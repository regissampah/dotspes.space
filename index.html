<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dotspes.</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        overflow: hidden;
    }

    body {
        background: #0e0e14;
        height: 100vh;
        width: 100vw;
        font-family: Arial, Helvetica, sans-serif;
        position: relative;
    }

    #container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    .letter {
        position: absolute;
        font-weight: bold;
        animation: fall linear forwards;
        user-select: none;
    }

    @keyframes fall {
        from {
            transform: translateY(-100px) rotate(0deg);
            opacity: 0;
        }
        to {
            transform: translateY(100vh) rotate(360deg);
            opacity: 1;
        }
    }
</style>
</head>

<body>

<div id="container"></div>

<script>
const text = "dotspes.";
const colors = ["#ff3b3b", "#3bff81", "#3b9bff", "#ffdb3b", "#ff3bf2", "#8b3bff", "#3bfff5"];

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function createLetter() {
    const container = document.getElementById("container");
    const span = document.createElement("span");

    const char = text[Math.floor(Math.random() * text.length)];

    span.classList.add("letter");
    span.innerText = char;

    const size = random(24, 90);

    span.style.left = random(0, 100) + "vw";
    span.style.fontSize = size + "px";
    span.style.color = colors[Math.floor(Math.random() * colors.length)];
    span.style.animationDuration = random(4, 9) + "s";
    span.style.top = "-100px";

    container.appendChild(span);

    setTimeout(() => {
        span.style.animation = "none";
        span.style.top = (window.innerHeight - random(20, 200)) + "px";
    }, 8000);

    setTimeout(() => {
        span.remove();
    }, 30000);
}

setInterval(createLetter, 200);
</script>

</body>
</html>
